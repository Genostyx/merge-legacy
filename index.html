<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Merge Legacy</title>
  <!--
    Phone-browser release. These are what separate "a web page with a game on
    it" from something that behaves like an installed app once a player adds it
    to their home screen: the manifest drives the Android install prompt, the
    apple-* pair does the same job on iOS, which ignores the manifest, and
    theme-color paints the browser chrome to match the game's own background so
    there is no bright strip above the canvas.
  -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./home-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./home-icon.svg" />
  <meta name="theme-color" content="#1c1a17" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Merge Legacy" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #1c1a17;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }
    #game-root {
      display: flex;
      align-items: center;
      justify-content: center;
      /* 100dvh, not 100vh: on mobile browsers 100vh is the height with the
         address bar HIDDEN, so the canvas is taller than the visible area
         until the bar collapses, and the bottom row of the board sits under
         it. dvh tracks the bar as it shows and hides. */
      height: 100dvh;
      width: 100vw;
    }
    /* The notch and the home indicator otherwise sit on top of the game. */
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
      /* Stops the pull-to-refresh gesture firing mid-drag on a merge. */
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="game-root"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

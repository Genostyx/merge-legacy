<meta charset="utf-8">
<title>Wood tier preview</title>
<style>
  body { margin: 0; background: #141413; }
  canvas { display: block; }
</style>
<div id="host"></div>
<script type="module">
  // A DEV PAGE. The icon sheet flattens every gradient triangle to its mean
  // colour - SVG has no per-vertex fill - so it cannot show smooth shading at
  // all. This boots the actual engine and calls the actual draw function, so
  // what appears here is exactly what the board draws, only bigger.
  //
  // ONE game, not one per icon. A browser allows on the order of sixteen live
  // WebGL contexts and silently kills the oldest past that, so a grid of
  // twenty-seven little Phaser instances renders as a grid of dead canvases.
  import Phaser from 'phaser';
  import { drawTierIcon } from '/src/game/objects/TierIcons.ts';
  import { materialLighting } from '/src/game/ui/Theme.ts';
  import { CHAINS } from '/src/game/data/chains.ts';

  const FAMILY = new URLSearchParams(location.search).get('family') ?? 'wood';
  const chain = CHAINS.find((c) => c.typeId === FAMILY);
  const TIERS = chain.tiers.map((t) => t.tier);
  const ROWS = [240, 96, 48];

  // Every row holds every tier, so the canvas is sized for the WIDEST row.
  // Sizing it off the first five left the big row silently clipped, which
  // is the one row worth looking at.
  const W = 40 + TIERS.length * (Math.max(...ROWS) + 40);
  const H = ROWS.reduce((t, s) => t + s + 56, 0) + 40;

  new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'host',
    width: W,
    height: H,
    backgroundColor: '#141413',
    scene: {
      create() {
        let y = 40;
        for (const size of ROWS) {
          let x = 40 + size / 2;
          for (const tier of TIERS) {
            const colour = chain.tiers.find((t) => t.tier === tier).color;
            const g = this.add.graphics().setPosition(x, y + size / 2);
            drawTierIcon(g, FAMILY, tier, size, materialLighting(colour, tier));
            this.add.text(x, y + size + 8, String(tier), {
              fontFamily: 'ui-monospace, monospace', fontSize: '13px', color: '#8a857c'
            }).setOrigin(0.5, 0);
            x += size + 40;
          }
          y += size + 56;
        }
      }
    }
  });
</script>
